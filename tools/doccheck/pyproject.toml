[project]
name = "doccheck"
version = "0.1.0"
description = "Lint the curriculum docs against docs/conventions.md."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
doccheck = "doccheck.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
