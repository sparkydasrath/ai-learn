[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textstats"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[project.scripts]
textstats = "textstats.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Sensible default rule set: pyflakes, pycodestyle, isort, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "strict"  # treat it like <Nullable>enable</Nullable> and then some
