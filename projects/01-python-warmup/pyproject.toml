[project]
name = "textstats"
version = "0.1.0"
description = "Module 01: text statistics CLI, a typed and tested Python warm-up."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[project.scripts]
textstats = "textstats.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Sensible default rule set: pyflakes, pycodestyle, isort, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "strict"  # treat it like <Nullable>enable</Nullable> and then some

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
