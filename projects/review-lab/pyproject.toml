[project]
name = "review-lab"
version = "0.1.0"
description = "Track R: review lab, with the gameable-tests exercise and the review journal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["gameable_tests/src"]
testpaths = ["gameable_tests/tests"]
